<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Recall Notes"><meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)"><link rel="icon" href="icon-192.png"><meta name="theme-color" content="#0b0e13" media="(prefers-color-scheme: dark)">
<title>Recall Notes</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;650;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#f6f7f9; --surface:#ffffff; --surface-2:#f0f2f5; --ink:#0f1419; --muted:#5d6878; --line:#e3e7ed;
  --accent:#0b7a57; --accent-ink:#ffffff; --accent-soft:#e3f3ec; --mark:#f5b83d;
  --good:#12804f; --good-bg:#e4f5ec; --bad:#c9302c; --bad-bg:#fdecec; --warn:#a15c00; --warn-bg:#fdf2dc;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.07);
  --shadow-lg:0 2px 6px rgba(16,24,40,.06),0 12px 32px -8px rgba(16,24,40,.16);
  --r:16px;
  --display:"Inter Tight","Inter",ui-sans-serif,system-ui,sans-serif;
  --body:"Inter",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b0e13; --surface:#141920; --surface-2:#1b212a; --ink:#e9edf3; --muted:#8e98a8; --line:#242b36;
  --accent:#43d39e; --accent-ink:#052117; --accent-soft:#12302a; --mark:#f5c451;
  --good:#4ade80; --good-bg:#11291d; --bad:#f87171; --bad-bg:#341719; --warn:#fbbf24; --warn-bg:#33270e;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 12px 36px -8px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0e13; --surface:#141920; --surface-2:#1b212a; --ink:#e9edf3; --muted:#8e98a8; --line:#242b36;
  --accent:#43d39e; --accent-ink:#052117; --accent-soft:#12302a; --mark:#f5c451;
  --good:#4ade80; --good-bg:#11291d; --bad:#f87171; --bad-bg:#341719; --warn:#fbbf24; --warn-bg:#33270e;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 12px 36px -8px rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
a{color:var(--accent)}
h2{font-family:var(--display);font-weight:700;font-size:1.5rem;margin:0;letter-spacing:-.025em;line-height:1.2}
h3{font-family:var(--display);font-weight:650;font-size:1.02rem;margin:0;letter-spacing:-.01em}
kbd{font-family:var(--mono);font-size:.72rem;padding:2px 6px;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);color:var(--muted)}

/* ---------- App shell ---------- */
.app{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100vh;min-height:100dvh}
.side{position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;gap:4px;padding:calc(18px + env(safe-area-inset-top,0px)) 12px calc(14px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));background:var(--surface);border-right:1px solid var(--line);overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 14px;text-decoration:none;color:var(--ink);font-family:var(--display);font-weight:700;font-size:1.08rem;letter-spacing:-.02em}
.brand img{width:30px;height:30px;border-radius:9px;box-shadow:var(--shadow)}
.nav-a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:500;font-size:.93rem;min-width:0}
.nav-a:hover{background:var(--surface-2)}
.nav-a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-a svg{width:18px;height:18px;flex:none;opacity:.85}
.nav-a .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-a .cnt{font-size:.72rem;font-weight:700;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--bad-bg);color:var(--bad);display:grid;place-items:center}
.nav-a .cdot{width:9px;height:9px;border-radius:3px;margin:0 4px}
.side-h{display:flex;justify-content:space-between;align-items:center;padding:16px 10px 6px;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.side-h a{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;text-decoration:none;color:var(--muted);font-size:1.1rem;font-weight:500}
.side-h a:hover{background:var(--surface-2);color:var(--ink)}
.side-empty{color:var(--muted);font-size:.88rem;padding:4px 10px;margin:0}
.side-foot{margin-top:auto;padding-top:12px;display:grid;gap:4px}
.content{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) 12px 24px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid transparent}
.topbar.scrolled{border-bottom-color:var(--line)}
.btn.menu-btn{display:none;box-shadow:none;padding:8px}
.search-wrap{position:relative;flex:1 1 auto;max-width:520px}
.search-wrap svg{position:absolute;left:12px;top:50%;width:17px;height:17px;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search-wrap kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);pointer-events:none}
.search{width:100%;font:inherit;padding:9px 60px 9px 38px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);box-shadow:var(--shadow);transition:border-color .15s,box-shadow .15s}
.search:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
.search:focus~kbd,.search:not(:placeholder-shown)~kbd{display:none}
.topbar .grow{flex:1}
.page-wrap{padding:8px 24px 64px;padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
#main{max-width:980px;margin:0 auto;display:grid;gap:22px;animation:in .22s ease-out}
#main.wide{max-width:1400px}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.scrim{display:none}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);z-index:30;transform:translateX(-102%);transition:transform .25s cubic-bezier(.2,.8,.2,1);box-shadow:var(--shadow-lg)}
  body.nav-open .side{transform:none}
  .scrim{display:block;position:fixed;inset:0;z-index:25;background:rgba(5,10,20,.42);opacity:0;pointer-events:none;transition:opacity .2s}
  body.nav-open .scrim{opacity:1;pointer-events:auto}
  .btn.menu-btn{display:inline-flex}
  .topbar{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .page-wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .search-wrap kbd{display:none}
  .search{padding-right:12px}
}
@media (max-width:560px){ #mLbl{display:none} #moodleBtn{padding:9px 11px} }
@media (prefers-reduced-motion:reduce){#main{animation:none}.side,.scrim{transition:none}}

/* ---------- Controls ---------- */
.btn{font:inherit;font-weight:600;font-size:.9rem;border-radius:10px;padding:8px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:7px;line-height:1.3;box-shadow:var(--shadow);transition:background .15s,border-color .15s,transform .1s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:color-mix(in srgb,var(--accent) 88%,var(--ink))}
.btn.ghost{background:none;border-color:transparent;box-shadow:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.small{padding:6px 11px;font-size:.84rem;border-radius:9px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:16px;height:16px;flex:none}
.link{font:inherit;background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-weight:600;text-decoration:none}
.link:hover{text-decoration:underline;text-underline-offset:3px}
.link.danger{color:var(--bad)}
:is(.btn,.link,.chip,input,select,textarea,a,summary,.row-open,button):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:grid;gap:14px;min-width:0;box-shadow:var(--shadow)}
.muted,.hint{color:var(--muted)} .hint{font-size:.86rem;margin:0}
.eyebrow{font-size:.78rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);opacity:.5;flex:none;display:inline-block}
.dot.ok{background:var(--good);opacity:1;box-shadow:0 0 0 3px var(--good-bg)} .dot.busy{background:var(--accent);opacity:1;animation:pulse 1s infinite alternate} .dot.err{background:var(--bad);opacity:1;box-shadow:0 0 0 3px var(--bad-bg)}
@keyframes pulse{to{opacity:.3}}
@media (prefers-reduced-motion:reduce){.dot.busy{animation:none}}
.statusline{display:flex;gap:10px;align-items:center;font-size:.88rem;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;flex-wrap:wrap;box-shadow:var(--shadow);max-width:980px;margin:0 auto 14px;width:100%}
.statusline .grow{flex:1 1 200px;min-width:0;overflow-wrap:anywhere}
.progress{height:4px;border-radius:99px;background:var(--surface-2);overflow:hidden;flex:1 1 100%} .progress i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s}
.sec-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.crumb{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:.86rem;color:var(--muted)}
.crumb a{font-weight:500;color:var(--muted);text-decoration:none} .crumb a:hover{color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{font:inherit;font-weight:500;font-size:.85rem;display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none;transition:background .15s}
.chip:hover{background:var(--surface-2)}
.chip span{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)} .chip[aria-pressed="true"] span{color:inherit;opacity:.7}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--surface-2);gap:2px}
.seg button{font:inherit;font-size:.82rem;font-weight:600;padding:5px 11px;border:0;border-radius:8px;background:none;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs a{white-space:nowrap;padding:10px 14px;font-weight:600;font-size:.92rem;color:var(--muted);text-decoration:none;border-bottom:2px solid transparent;display:flex;gap:7px;align-items:center}
.tabs a:hover{color:var(--ink)}
.tabs a span{font-size:.72rem;padding:1px 7px;border-radius:99px;background:var(--surface-2);font-variant-numeric:tabular-nums}
.tabs a[aria-current="page"]{color:var(--ink);border-color:var(--accent)}
.tabs a[aria-current="page"] span{background:var(--accent-soft);color:var(--accent)}

/* ---------- Home ---------- */
.hero{display:grid;gap:4px;padding-top:6px}
.hero h2{font-size:clamp(1.6rem,3.2vw,2.1rem)}
.hero p.sub{margin:2px 0 0;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:700px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);display:grid;gap:2px;text-decoration:none;color:var(--ink)}
.stat b{font-family:var(--display);font-size:1.7rem;font-weight:700;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:.82rem;color:var(--muted);font-weight:500}
.stat.bad b{color:var(--bad)}
.welcome{padding:28px;gap:18px;background:linear-gradient(135deg,var(--accent-soft),var(--surface) 60%)}
.welcome h2{font-size:1.7rem}
.feats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:0;padding:0;list-style:none}
@media (max-width:700px){.feats{grid-template-columns:1fr}}
.feats li{display:grid;gap:4px;padding:14px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.feats b{font-weight:600} .feats span{font-size:.86rem;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.course{display:grid;gap:4px;align-content:start;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;overflow:hidden;min-width:0;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s}
.course:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.course-top{height:64px;padding:12px 14px;display:flex;justify-content:space-between;align-items:flex-start;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 55%,#000));margin-bottom:8px}
.course-top .code{font-family:var(--display);font-weight:700;font-size:.82rem;letter-spacing:.02em;color:#fff;background:rgba(255,255,255,.18);padding:3px 9px;border-radius:7px;max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.course-top .pill{font-size:.74rem;font-weight:700;color:var(--c);background:#fff;padding:3px 9px;border-radius:99px}
.course b{font-family:var(--display);font-weight:650;font-size:1rem;line-height:1.3;letter-spacing:-.01em;overflow-wrap:anywhere;padding:0 14px}
.course small{color:var(--muted);font-size:.82rem;padding:0 14px 14px}
.cdot{width:9px;height:9px;border-radius:3px;background:var(--c,var(--accent));display:inline-block;flex:none}
.day{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;align-items:start}
.day+.day{margin-top:10px}
.day-h{font-size:.84rem;font-weight:600;color:var(--muted);padding-top:12px}
.day-h.late{color:var(--bad)} .day-h.today{color:var(--accent)}
@media (max-width:620px){.day{grid-template-columns:1fr;gap:6px}.day-h{padding-top:0}}
.note-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.note-card{display:grid;gap:6px;align-content:start;padding:16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);color:var(--ink);text-decoration:none;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s;min-width:0}
.note-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.note-card .nc-course{display:flex;gap:6px;align-items:center;font-size:.76rem;font-weight:600;color:var(--muted);min-width:0}
.note-card .nc-course span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note-card b{font-family:var(--display);font-weight:650;font-size:1rem;letter-spacing:-.01em;overflow-wrap:anywhere}
.note-card p{margin:0;font-size:.86rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.note-card small{font-size:.76rem;color:var(--muted)}
.banner{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;padding:22px 22px 18px;border-radius:var(--r);background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 50%,#000));color:#fff;box-shadow:var(--shadow-lg)}
.banner h2{color:#fff;font-size:clamp(1.35rem,3vw,1.8rem)}
.banner .eyebrow{color:rgba(255,255,255,.75)}
.banner-txt{display:grid;gap:4px;min-width:0}
.banner .btn{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.22);color:#fff;box-shadow:none;backdrop-filter:blur(6px)}
.banner .btn:hover{background:rgba(255,255,255,.26)}
.banner .menu-pop{color:var(--ink)}

/* ---------- Lists ---------- */
.list{display:grid;gap:8px}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);min-width:0;box-shadow:var(--shadow);transition:border-color .15s,box-shadow .15s}
.row:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.row-open{color:var(--ink);text-decoration:none;display:grid;gap:3px;min-width:0;border-radius:6px}
.row-open b{font-weight:600;overflow-wrap:anywhere;letter-spacing:-.005em}
.row-open small{color:var(--muted);font-size:.8rem;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.kind{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--surface-2);color:var(--muted);flex:none}
.kind svg{width:19px;height:19px}
.kind.slides{color:#d4581a;background:color-mix(in srgb,#f97316 13%,transparent)}
.kind.notes{color:var(--good);background:color-mix(in srgb,#22c55e 13%,transparent)}
.kind.reading{color:#7c4ddb;background:color-mix(in srgb,#8b5cf6 13%,transparent)}
.kind.link{color:#2563eb;background:color-mix(in srgb,#3b82f6 13%,transparent)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .kind.slides{color:#fb923c}:root:not([data-theme="light"]) .kind.reading{color:#a78bfa}:root:not([data-theme="light"]) .kind.link{color:#60a5fa}}
.tag{font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.tag.good{background:var(--good-bg);color:var(--good)} .tag.bad{background:var(--bad-bg);color:var(--bad)} .tag.warn{background:var(--warn-bg);color:var(--warn)} .tag.acc{background:var(--accent-soft);color:var(--accent)}
.group{display:grid;gap:10px}
.group-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:4px}
.group-h h2{font-size:1.15rem}
.group-h h3 span{font-size:.74rem;color:var(--muted);font-weight:500;margin-left:6px;font-family:var(--body)}
.group-sum{font-size:.86rem;color:var(--muted);margin:-6px 0 0}
.empty{text-align:center;color:var(--muted);padding:32px 16px;border:1.5px dashed var(--line);border-radius:var(--r);display:grid;gap:12px;justify-items:center;margin:0;font-size:.92rem}
.empty p{margin:0}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.form{display:grid;gap:14px}
.form label{font-weight:600;font-size:.88rem;display:grid;gap:6px}
.form label small{font-weight:400;color:var(--muted)}
.in{font:inherit;padding:10px 13px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%;min-width:0;transition:border-color .15s,box-shadow .15s}
.in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 16%,transparent)}
select.in{padding:8px 10px}
.err{color:var(--bad);margin:0;font-size:.88rem;background:var(--bad-bg);padding:10px 12px;border-radius:10px}
details.more{border-top:1px solid var(--line);padding-top:14px}
details.more summary{cursor:pointer;font-weight:600;color:var(--accent)}
.steps{margin:8px 0 0;padding-left:20px;color:var(--muted);font-size:.88rem;display:grid;gap:4px}
.steps b{color:var(--ink)}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;transition:border-color .15s,background .15s}
.check input{accent-color:var(--accent);margin:3px 0 0;flex:none;width:17px;height:17px}
.check:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}

<script>
/* ============ Basics ============ */
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const DAY=864e5;
const extOf=n=>{ const m=/\.([a-z0-9]{1,5})(?:$|[?#])/i.exec(n||""); return m?m[1].toLowerCase():""; };
const trimTo=(s,n)=>{ s=String(s||"").replace(/\s+/g," ").trim(); return s.length>n?s.slice(0,n-1).trimEnd()+"…":s; };
const fmtSize=b=>!b?"":b<1024?b+" B":b<1048576?Math.round(b/1024)+" KB":(b/1048576).toFixed(b<1048576*10?1:0)+" MB";
function hash(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return (h>>>0).toString(36); }
let toastT; function toast(msg){ const t=$("toast"); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,3200); }
const dayStart=t=>{ const d=new Date(t); d.setHours(0,0,0,0); return d.getTime(); };
function fmtDue(t){
  if(!t) return "No due date";
  const d=new Date(t), days=Math.round((dayStart(t)-dayStart(Date.now()))/DAY);
  const time=d.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});
  if(days===0) return "Today "+time; if(days===1) return "Tomorrow "+time; if(days===-1) return "Yesterday "+time;
  if(days>1&&days<7) return d.toLocaleDateString([], {weekday:"short"})+" "+time;
  return d.toLocaleDateString([], {month:"short",day:"numeric",year:d.getFullYear()!==new Date().getFullYear()?"numeric":undefined})+" "+time;
}
function ago(t){ if(!t) return "never"; const s=(Date.now()-t)/1000; if(s<60) return "just now"; if(s<3600) return Math.round(s/60)+" min ago"; if(s<86400) return Math.round(s/3600)+" h ago"; return new Date(t).toLocaleDateString([], {month:"short",day:"numeric"}); }
const COLORS=["#2a4fd6","#c2541b","#1d8a5b","#7a4fd6","#c23b6b","#0f8a9a","#a86a00","#5d6779"];

const IC={
  slides:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M12 16v4M8 20h8M7 12l3-3 2 2 4-4"/></svg>',
  notes:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4M9 12h7M9 16h7M9 8h3"/></svg>',
  reading:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5.5C5 4.5 8.5 4.5 12 6.5c3.5-2 7-2 9-1v13c-2-1-5.5-1-9 1-3.5-2-7-2-9-1z"/><path d="M12 6.5v13"/></svg>',

  note:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1-4.5L15.5 5a2.1 2.1 0 013 3L8 18.5z"/><path d="M13.5 7l3 3"/></svg>',

};
const KINDS={slides:"Slides",notes:"Notes & handouts",reading:"Readings",link:"Links",other:"Other files"};
const KIND_ORDER=["slides","notes","reading","link","other"];

/* ============ Storage (IndexedDB: state, file blobs, extracted text) ============ */
const DB=(()=>{
  let p;
  const open=()=>p||(p=new Promise((ok,no)=>{ const r=indexedDB.open("recall-notes",1);
    r.onupgradeneeded=()=>{ const d=r.result; ["kv","files","text"].forEach(s=>d.objectStoreNames.contains(s)||d.createObjectStore(s)); };
    r.onsuccess=()=>ok(r.result); r.onerror=()=>no(r.error); }));
  const tx=(store,mode,fn)=>open().then(d=>new Promise((ok,no)=>{ const t=d.transaction(store,mode), req=fn(t.objectStore(store)); t.oncomplete=()=>ok(req&&req.result); t.onerror=()=>no(t.error); t.onabort=()=>no(t.error); }));
  return {
    get:(s,k)=>tx(s,"readonly",o=>o.get(k)),
    put:(s,k,v)=>tx(s,"readwrite",o=>o.put(v,k)),
    del:(s,k)=>tx(s,"readwrite",o=>o.delete(k)),
    all:s=>open().then(d=>new Promise((ok,no)=>{ const out={}, t=d.transaction(s), c=t.objectStore(s).openCursor();
      c.onsuccess=()=>{ const cur=c.result; if(cur){ out[cur.key]=cur.value; cur.continue(); } }; t.oncomplete=()=>ok(out); t.onerror=()=>no(t.error); }))
  };
})();
let ST, TEXT={};
function blank(){ return {v:1,moodle:null,courses:{},materials:{},notes:{},assignments:{},outlined:{},settings:{autoDownload:true,maxMB:40,autoOutline:true,showPast:false}}; }
let saveT;
function save(){ clearTimeout(saveT); saveT=setTimeout(flush,250); }
function flush(){ clearTimeout(saveT); saveT=null; if(!ST) return Promise.resolve(); return DB.put("kv","state",ST).catch(e=>toast("Couldn't save on this device: "+(e.message||e))); }
window.addEventListener("pagehide",flush);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden") flush(); });
async function putText(id,t){ TEXT[id]=t; try{ await DB.put("text",id,t); }catch(e){} }
async function removeMaterial(id){ delete ST.materials[id]; delete TEXT[id]; try{ await DB.del("files",id); await DB.del("text",id); }catch(e){} }

/* ============ Moodle web service client ============ */
class MoodleError extends Error{ constructor(msg,code){ super(msg); this.code=code; } }
function normSite(raw){
  let s=(raw||"").trim(); if(!s) throw new MoodleError("Enter your Moodle address.","input");
  if(!/^https?:\/\//i.test(s)) s="https://"+s;
  let u; try{ u=new URL(s); }catch(e){ throw new MoodleError("That doesn't look like a web address.","input"); }
  let path=u.pathname.replace(/\/(login|my|course|user|admin|mod|webservice|calendar|grade)(\/.*)?$/i,"").replace(/\/(index\.php)?$/i,"").replace(/\/+$/,"");
  return u.origin+path;
}
async function post(url,params){
  const body=new URLSearchParams(); for(const [k,v] of Object.entries(params)) body.append(k,v);
  let r;
  try{ r=await fetch(url,{method:"POST",body,credentials:"omit"}); }
  catch(e){ throw new MoodleError(navigator.onLine?"Couldn't reach that Moodle site. Check the address. If it's right, your school may block apps from connecting (see “Other ways to connect” below).":"You're offline.","network"); }
  const txt=await r.text(); let j;
  try{ j=JSON.parse(txt); }catch(e){ throw new MoodleError(r.status===404?"That address isn't a Moodle site (the app sign-in page wasn't found).":"Moodle sent back something unexpected (HTTP "+r.status+"). Check the address.","notmoodle"); }
  return j;
}
function flat(obj,pre="",out={}){ for(const [k,v] of Object.entries(obj)){ const key=pre?`${pre}[${k}]`:k; if(v!==null&&typeof v==="object") flat(v,key,out); else if(v!==undefined) out[key]=typeof v==="boolean"?(v?1:0):v; } return out; }
const WS_HINT={
  invalidtoken:"Your Moodle sign-in has expired or was revoked. Connect again.",
  accessexception:"Moodle refused access. Your account may not be allowed to use the Moodle app.",
  webservicesnotenabled:"This Moodle site has the app connection turned off.",
  servicenotavailable:"This Moodle site has the app connection turned off.",
  enablewsdescription:"This Moodle site has the app connection turned off. Ask your school's Moodle admin to enable “mobile web services”, or add files yourself.",
  invalidlogin:"Wrong username or password. If your school signs you in through Microsoft, Google or another single sign-on page, use a security key instead (see below).",
  sitemaintenance:"This Moodle site is in maintenance mode. Try again later.",
  usernotconfirmed:"Your Moodle account hasn't been confirmed yet.",
  passwordisexpired:"Your Moodle password has expired. Change it on the Moodle website first."
};
async function wsCall(m,fn,args={}){
  const j=await post(m.site+"/webservice/rest/server.php?moodlewsrestformat=json",{wstoken:m.token,wsfunction:fn,...flat(args)});
  if(j&&j.exception) throw new MoodleError(WS_HINT[j.errorcode]||j.message||"Moodle returned an error.",j.errorcode);
  return j;
}
const ws=(fn,args)=>wsCall(ST.moodle,fn,args);
async function login(site,username,password){
  const j=await post(site+"/login/token.php",{username,password,service:"moodle_mobile_app"});
  if(j.error||!j.token) throw new MoodleError(WS_HINT[j.errorcode]||j.error||"Moodle didn't accept that sign-in.",j.errorcode||"login");
  return j.token;
}
async function siteInfo(site,token){
  const info=await wsCall({site,token},"core_webservice_get_site_info");
  return {site:(info.siteurl||site).replace(/\/+$/,""),token,userid:info.userid,fullname:info.fullname,sitename:info.sitename,functions:(info.functions||[]).map(f=>f.name)};
}
const can=fn=>!ST.moodle||!ST.moodle.functions||!ST.moodle.functions.length||ST.moodle.functions.includes(fn);

  const m=ST.moodle; let all=null, current=new Set();

/* ============ Sorting files into kinds ============ */
function classify(name,file,type){
  if(type==="link") return "link";
  if(type==="page") return "notes";
  const ext=extOf(file||name), s=(" "+name+" "+(file||"")+" ").toLowerCase().replace(/[_\-.()[\]]+/g," ");
  if(["ppt","pptx","key","odp","pps","ppsx"].includes(ext)) return "slides";
  if(/\b(slides?|lecture|lect?\s?\d+|deck|presentation|powerpoint|ppt)\b/.test(s)) return "slides";
  if(/\b(notes?|handouts?|summary|study\s?guide|outline|cheat\s?sheet|review|worksheet)\b/.test(s)) return "notes";
  if(/\b(readings?|chapter|ch\s?\d+|articles?|paper|textbook|excerpt|book)\b/.test(s)) return "reading";
  if(["mp4","mov","webm","mp3","m4a","wav"].includes(ext)) return "other";
  return "other";
}

const SYNC={on:false,label:"",done:0,total:0,err:null};
function syncLine(){
  const el=$("syncLine");
  if(!SYNC.on&&!SYNC.err&&!SYNC.msg){ el.hidden=true; return; }
  el.hidden=false;
  const pct=SYNC.total?Math.round(SYNC.done/SYNC.total*100):0;
  el.innerHTML=SYNC.on
    ? `<span class="dot busy"></span><span class="grow">${esc(SYNC.label)}${SYNC.total?` · ${SYNC.done} of ${SYNC.total}`:""}</span><div class="progress"><i style="width:${pct}%"></i></div>`

    : `<span class="dot ok"></span><span class="grow">${esc(SYNC.msg)}</span><button class="link" data-act="dismissSync">Dismiss</button>`;

}

async function syncAll(only){
  if(SYNC.on||!ST.moodle) return;
  Object.assign(SYNC,{on:true,label:"Checking your Moodle classes",done:0,total:0,err:null,msg:null}); syncLine();
  const courses=Object.values(ST.courses).filter(c=>c.moodleId&&!c.archived&&(!only||only.includes(c.id)));
  const before=Object.keys(ST.materials).length, beforeA=Object.keys(ST.assignments).length;
  try{
    for(const c of courses){ SYNC.label="Reading "+c.name; syncLine(); await syncCourse(c); save(); render(); }
    SYNC.label="Getting assignments"; syncLine();
    await syncAssignments(courses);
    ST.moodle.lastSync=Date.now(); save(); render();
    await downloadQueue();
    const nm=Object.keys(ST.materials).length-before, na=Object.keys(ST.assignments).length-beforeA;
    SYNC.on=false; SYNC.msg=`Synced ${courses.length} class${courses.length===1?"":"es"}`+(nm>0?` · ${nm} new file${nm===1?"":"s"}`:"")+(na>0?` · ${na} new assignment${na===1?"":"s"}`:"")+".";
  }catch(e){
    SYNC.on=false; SYNC.err="Sync stopped: "+(e.message||e);
  }
  save(); syncLine(); render();
  if(SYNC.msg) setTimeout(()=>{ if(!SYNC.on&&SYNC.msg){ SYNC.msg=null; syncLine(); } },6000);
}
function wsFileUrl(u){ if(!u) return u; return u.includes("/webservice/pluginfile.php")?u:u.replace("/pluginfile.php","/webservice/pluginfile.php"); }
async function syncCourse(c){
  const contents=await ws("core_course_get_contents",{courseid:c.moodleId});
  const site=ST.moodle.site, seen=new Set();
  c.cmSec={}; contents.forEach(s=>(s.modules||[]).forEach(mod=>c.cmSec[mod.id]="s"+s.id));
  c.sections=contents.map(s=>({id:"s"+s.id,num:s.section,name:(s.name||"").trim()||(s.section===0?"General":"Section "+s.section),summary:trimTo(htmlText(s.summary||""),240)}));
  const up=(id,data)=>{
    seen.add(id); const old=ST.materials[id];
    const m=Object.assign(old||{id,courseId:c.id,source:"moodle",status:"remote",addedAt:Date.now()},data);
    if(!old||!old.kindSet) m.kind=classify(m.name,m.file,m.type);
    if(!old||!old.sectionSet){ m.sectionId=data.sectionId; }
    if(old&&old.status==="saved"&&data.mtime&&old.savedMtime&&data.mtime>old.savedMtime) m.status="stale";
    ST.materials[id]=m; return m;
  };
  for(const s of contents){
    for(const mod of s.modules||[]){
      if(mod.uservisible===false||mod.visible===0) continue;
      const base={sectionId:"s"+s.id,modId:mod.id,moodleUrl:mod.url||`${site}/mod/${mod.modname}/view.php?id=${mod.id}`};
      if(mod.modname==="resource"||mod.modname==="folder"){
        for(const f of (mod.contents||[]).filter(f=>f.type==="file")){
          const id="mo"+mod.id+"-"+hash((f.filepath||"/")+f.filename);
          const name=mod.modname==="resource"&&(mod.contents||[]).filter(x=>x.type==="file").length===1?mod.name:f.filename;
          up(id,{...base,type:"file",name,file:f.filename,group:mod.modname==="folder"?mod.name:"",fileurl:wsFileUrl(f.fileurl),size:f.filesize||0,mtime:(f.timemodified||0)*1000,mime:f.mimetype||""});
        }
      } else if(mod.modname==="url"){
        const f=(mod.contents||[])[0];
        up("mu"+mod.id,{...base,type:"link",name:mod.name,href:(f&&f.fileurl)||mod.url,status:"saved"});
      } else if(mod.modname==="page"){
        up("mp"+mod.id,{...base,type:"page",name:mod.name,status:ST.materials["mp"+mod.id]?.status==="saved"?"saved":"remote",mtime:((mod.contents||[])[0]?.timemodified||0)*1000});
      }
    }
  }
  // Moodle pages: pull their text in one call
  const pageIds=[...seen].filter(id=>id.startsWith("mp"));
  if(pageIds.length&&can("mod_page_get_pages_by_courses")){
    try{
      const r=await ws("mod_page_get_pages_by_courses",{courseids:[c.moodleId]});
      for(const p of r.pages||[]){
        const m=ST.materials["mp"+p.coursemodule]; if(!m) continue;
        const html=cleanHtml(p.content||""); await putText(m.id,{html,text:htmlText(p.content||"")});
        m.status="saved"; m.size=html.length;
      }
    }catch(e){ if(e.code==="invalidtoken") throw e; }
  }
  // Things removed from Moodle: drop them unless a note points at them
  for(const m of Object.values(ST.materials)){
    if(m.courseId!==c.id||m.source!=="moodle"||seen.has(m.id)||m.assignId) continue;
    if(Object.values(ST.notes).some(n=>n.materialId===m.id)) m.gone=true; else await removeMaterial(m.id);
  }
  c.syncedAt=Date.now();
}
async function syncAssignments(courses){

  const byMoodle=Object.fromEntries(courses.map(c=>[c.moodleId,c]));
  const r=await ws("mod_assign_get_assignments",{courseids:courses.map(c=>c.moodleId)});
  const seen=new Set();
  for(const cr of r.courses||[]){
    const c=byMoodle[cr.id]; if(!c) continue;
    for(const a of cr.assignments||[]){
      const id="a"+a.id; seen.add(id); const old=ST.assignments[id]||{};
      ST.assignments[id]=Object.assign(old,{id,courseId:c.id,moodleId:a.id,cmid:a.cmid,name:a.name,due:(a.duedate||0)*1000,cutoff:(a.cutoffdate||0)*1000,opens:(a.allowsubmissionsfromdate||0)*1000,
        intro:cleanHtml(a.intro||""),url:`${ST.moodle.site}/mod/assign/view.php?id=${a.cmid}`});
      for(const f of a.introattachments||[]){
        const mid="ma"+a.id+"-"+hash((f.filepath||"/")+f.filename), om=ST.materials[mid];
        ST.materials[mid]=Object.assign(om||{id:mid,courseId:c.id,source:"moodle",status:"remote",addedAt:Date.now(),kind:"notes"},
          {type:"file",name:f.filename,file:f.filename,assignId:id,group:"Assignment: "+a.name,sectionId:om?.sectionSet?om.sectionId:sectionOfCm(c,a.cmid),fileurl:wsFileUrl(f.fileurl),size:f.filesize||0,mtime:(f.timemodified||0)*1000,mime:f.mimetype||"",moodleUrl:ST.assignments[id].url});
      }
    }
  }
  for(const a of Object.values(ST.assignments)) if(a.moodleId&&!seen.has(a.id)&&courses.some(c=>c.id===a.courseId)) delete ST.assignments[a.id];
  // Submitted? Only check the ones that still matter
  if(!can("mod_assign_get_submission_status")) return;

  SYNC.label="Checking what you've handed in"; SYNC.done=0; SYNC.total=check.length; syncLine();
  await pool(check,4,async a=>{

      a.submitted=st==="submitted"; if(s.feedback?.gradefordisplay) a.grade=htmlText(s.feedback.gradefordisplay); }
    catch(e){ if(e.code==="invalidtoken") throw e; }
    SYNC.done++; syncLine();

}
function sectionOfCm(c,cmid){ return (c.cmSec&&c.cmSec[cmid])||null; }
async function pool(items,n,fn){ let i=0; await Promise.all(Array.from({length:Math.min(n,items.length)},async()=>{ while(i<items.length) await fn(items[i++]); })); }

/* ============ Downloading files and reading their text ============ */
async function downloadQueue(){
  const lim=(ST.settings.maxMB||40)*1048576;
  const q=Object.values(ST.materials).filter(m=>m.type==="file"&&m.fileurl&&(m.status==="remote"||m.status==="stale")&&!m.dlFailed&&ST.settings.autoDownload&&(!m.size||m.size<=lim));
  if(!q.length) return;
  SYNC.label="Downloading slides and files"; SYNC.done=0; SYNC.total=q.length; syncLine();
  let failed=0;
  await pool(q,3,async m=>{ try{ await downloadOne(m); }catch(e){ failed++; m.dlFailed=e.message||String(e); } SYNC.done++; syncLine(); save(); });
  if(failed) toast(`${failed} file${failed===1?"":"s"} couldn't be downloaded. Open them in Moodle and drop them in here instead.`);
}
async function downloadOne(m){
  const u=m.fileurl+(m.fileurl.includes("?")?"&":"?")+"token="+encodeURIComponent(ST.moodle.token);
  let r; try{ r=await fetch(u,{credentials:"omit"}); }catch(e){ throw new Error("Moodle didn't let the browser download this file."); }
  if(!r.ok) throw new Error("Download failed (HTTP "+r.status+").");
  const blob=await r.blob();
  if(/json/.test(blob.type)&&blob.size<4000){ const t=await blob.text(); if(/"error"|"exception"/.test(t)) throw new Error("Moodle wouldn't hand over this file."); }
  await storeFile(m,blob);
}
async function storeFile(m,blob){
  await DB.put("files",m.id,blob);
  m.status="saved"; m.savedMtime=m.mtime||Date.now(); m.size=blob.size; m.mime=m.mime||blob.type; delete m.dlFailed;
  await extract(m,blob);
  if(ST.settings.autoOutline&&m.kind==="slides"&&!ST.outlined[m.id]) makeOutline(m);
  save();
}
async function extract(m,blob){
  const ext=extOf(m.file||m.name); let out=null; delete m.readErr;
  try{
    if(ext==="pdf"||/pdf/.test(blob.type)) out=await pdfExtract(await blob.arrayBuffer());
    else if(ext==="pptx"||ext==="ppsx") out=await pptxExtract(await blob.arrayBuffer());
    else if(ext==="docx") out=await docxExtract(await blob.arrayBuffer());
    else if(["txt","md","csv","tsv"].includes(ext)||/^text\/plain/.test(blob.type)) out={text:await blob.text()};
    else if(ext==="html"||ext==="htm") { const h=await blob.text(); out={html:cleanHtml(h),text:htmlText(h)}; }
  }catch(e){ m.readErr=e.message||String(e); }
  if(out){ if(!out.text&&out.slides) out.text=out.slides.map(s=>[s.title,...s.lines,s.notes].filter(Boolean).join("\n")).join("\n\n"); m.pages=out.slides?out.slides.length:0; await putText(m.id,out); }
}
// Minimal .zip reader for Office files
async function unzip(buf,want){
  const dv=new DataView(buf), out={};
  let e=buf.byteLength-22; while(e>=0&&dv.getUint32(e,true)!==0x06054b50) e--;
  if(e<0) throw new Error("This file looks damaged.");
  let off=dv.getUint32(e+16,true); const n=dv.getUint16(e+10,true), dec=new TextDecoder();
  for(let i=0;i<n;i++){
    if(dv.getUint32(off,true)!==0x02014b50) break;
    const method=dv.getUint16(off+10,true), csize=dv.getUint32(off+20,true), nl=dv.getUint16(off+28,true), xl=dv.getUint16(off+30,true), cl=dv.getUint16(off+32,true), lho=dv.getUint32(off+42,true);
    const name=dec.decode(new Uint8Array(buf,off+46,nl)); off+=46+nl+xl+cl;
    if(!want(name)) continue;
    const start=lho+30+dv.getUint16(lho+26,true)+dv.getUint16(lho+28,true), data=new Uint8Array(buf,start,csize);
    if(method===0) out[name]=dec.decode(data);
    else if(method===8){
      if(typeof DecompressionStream==="undefined") throw new Error("This browser can't open Office files.");
      out[name]=await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).text();
    }
  }
  return out;
}
const xml=t=>new DOMParser().parseFromString(t,"application/xml");
const NS={p:"http://schemas.openxmlformats.org/presentationml/2006/main",a:"http://schemas.openxmlformats.org/drawingml/2006/main",w:"http://schemas.openxmlformats.org/wordprocessingml/2006/main"};
async function pptxExtract(buf){
  const f=await unzip(buf,n=>/^ppt\/(slides|notesSlides)\/(_rels\/)?(slide|notesSlide)\d+\.xml(\.rels)?$/.test(n)||n==="ppt/presentation.xml"||n==="ppt/_rels/presentation.xml.rels");
  let order=[];
  try{
    const rels=Object.fromEntries([...xml(f["ppt/_rels/presentation.xml.rels"]).getElementsByTagName("Relationship")].map(r=>[r.getAttribute("Id"),r.getAttribute("Target")]));
    order=[...xml(f["ppt/presentation.xml"]).getElementsByTagNameNS(NS.p,"sldId")].map(s=>"ppt/"+rels[s.getAttribute("r:id")].replace(/^\/?ppt\//,"")).filter(k=>f[k]);
  }catch(e){}
  if(!order.length) order=Object.keys(f).filter(k=>/^ppt\/slides\/slide\d+\.xml$/.test(k)).sort((a,b)=>+a.match(/\d+/)-+b.match(/\d+/));
  const paras=el=>[...el.getElementsByTagNameNS(NS.a,"p")].map(p=>[...p.getElementsByTagNameNS(NS.a,"t")].map(t=>t.textContent).join("").trim()).filter(Boolean);
  const slides=order.map((k,i)=>{
    const d=xml(f[k]); let title="", lines=[];
    for(const sp of d.getElementsByTagNameNS(NS.p,"sp")){
      const ph=sp.getElementsByTagNameNS(NS.p,"ph")[0], t=ph&&ph.getAttribute("type");
      if(t==="sldNum"||t==="dt"||t==="ftr") continue;
      const ps=paras(sp); if(!ps.length) continue;
      if((t==="title"||t==="ctrTitle")&&!title) title=ps.join(" "); else lines.push(...ps);
    }
    for(const g of d.getElementsByTagNameNS(NS.p,"graphicFrame")) for(const tr of g.getElementsByTagNameNS(NS.a,"tr")) lines.push([...tr.getElementsByTagNameNS(NS.a,"tc")].map(tc=>paras(tc).join(" ")).join(" | "));
    if(!title&&lines.length) title=lines.shift();
    let notes="";
    try{
      const rel=[...xml(f[k.replace("slides/","slides/_rels/")+".rels"]).getElementsByTagName("Relationship")].find(r=>/notesSlide$/.test(r.getAttribute("Type")));
      if(rel){ const nk="ppt/notesSlides/"+rel.getAttribute("Target").split("/").pop(), nd=f[nk]&&xml(f[nk]);
        if(nd) for(const sp of nd.getElementsByTagNameNS(NS.p,"sp")){ const ph=sp.getElementsByTagNameNS(NS.p,"ph")[0]; if(ph&&ph.getAttribute("type")==="body") notes+=paras(sp).join("\n"); } }
    }catch(e){}
    return {n:i+1,title,lines,notes};
  });
  return {slides};
}
async function docxExtract(buf){
  const f=await unzip(buf,n=>n==="word/document.xml");
  if(!f["word/document.xml"]) throw new Error("Couldn't find the text in that Word file.");
  const body=xml(f["word/document.xml"]).getElementsByTagNameNS(NS.w,"body")[0], md=[];
  for(const p of body.getElementsByTagNameNS(NS.w,"p")){
    const t=[...p.getElementsByTagNameNS(NS.w,"t")].map(x=>x.textContent).join("").trim(); if(!t) continue;
    const st=p.getElementsByTagNameNS(NS.w,"pStyle")[0]?.getAttributeNS(NS.w,"val")||"";
    const h=/^(Title|Heading1)$/i.test(st)?"## ":/^Heading[2-3]$/i.test(st)?"### ":/List/i.test(st)?"- ":"";
    md.push(h+t);
  }
  return {md:md.join("\n\n"),text:md.join("\n").replace(/^(#+|-) /gm,"")};
}
function loadScript(src){ return new Promise((ok,no)=>{ const s=document.createElement("script"); s.src=src; s.onload=ok; s.onerror=()=>no(new Error("Couldn't load the PDF reader. Open the app once while online.")); document.head.appendChild(s); }); }
async function pdfjs(){ if(!window.pdfjsLib){ await loadScript("../vendor/pdf.min.js"); } pdfjsLib.GlobalWorkerOptions.workerSrc="../vendor/pdf.worker.min.js"; return pdfjsLib; }
async function pdfExtract(buf){
  const lib=await pdfjs(), pdf=await lib.getDocument({data:new Uint8Array(buf),isEvalSupported:false}).promise, slides=[];
  for(let p=1;p<=pdf.numPages;p++){
    const items=(await (await pdf.getPage(p)).getTextContent()).items.filter(i=>i.str!==undefined&&i.str.trim());
    const rows=[];
    for(const it of items){
      const y=it.transform[5], size=Math.hypot(it.transform[2],it.transform[3])||10;
      let row=rows.find(r=>Math.abs(r.y-y)<size*0.45); if(!row){ row={y,items:[],size:0}; rows.push(row); }
      row.items.push({x:it.transform[4],w:it.width,s:it.str,size}); row.size=Math.max(row.size,size);
    }
    rows.sort((a,b)=>b.y-a.y);
    const lines=rows.map(r=>{ r.items.sort((a,b)=>a.x-b.x); let l="",end=null; for(const it of r.items){ if(end!==null&&it.x-end>it.size*0.15) l+=" "; l+=it.s; end=it.x+it.w; } return {t:l.replace(/\s+/g," ").trim(),size:r.size}; }).filter(l=>l.t);
    let ti=-1, big=0; lines.slice(0,4).forEach((l,i)=>{ if(l.size>big*1.05&&l.t.length<=120){ big=l.size; ti=i; } });
    const title=ti>=0?lines[ti].t:"";
    slides.push({n:p,title,lines:lines.filter((l,i)=>i!==ti).map(l=>l.t),notes:""});
  }
  return {slides,pdf:true};
}

/* ============ HTML from Moodle: keep the text, drop anything active ============ */
const OK_TAGS=new Set("P BR B STRONG I EM U S UL OL LI H1 H2 H3 H4 H5 H6 A TABLE THEAD TBODY TFOOT TR TD TH BLOCKQUOTE PRE CODE SPAN DIV HR SUB SUP SMALL DL DT DD".split(" "));
const DROP_TAGS=new Set("SCRIPT STYLE IFRAME OBJECT EMBED FORM INPUT BUTTON TEXTAREA SELECT LINK META SVG MATH NOSCRIPT TEMPLATE IMG VIDEO AUDIO SOURCE CANVAS FRAME FRAMESET BASE".split(" "));
function cleanHtml(html){
  const doc=new DOMParser().parseFromString(String(html),"text/html");
  const walk=n=>{ for(const c of [...n.children]){
    if(DROP_TAGS.has(c.tagName)){ c.remove(); continue; }
    walk(c);
    if(!OK_TAGS.has(c.tagName)){ c.replaceWith(...c.childNodes); continue; }
    for(const a of [...c.attributes]){ const k=a.name.toLowerCase(); if((c.tagName==="A"&&k==="href"&&/^https?:\/\//i.test(a.value.trim()))||k==="colspan"||k==="rowspan") continue; c.removeAttribute(a.name); }
    if(c.tagName==="A"){ c.setAttribute("target","_blank"); c.setAttribute("rel","noopener noreferrer"); }
  } };
  walk(doc.body); return doc.body.innerHTML.trim();
}
function htmlText(html){ const d=new DOMParser().parseFromString(String(html),"text/html"); d.querySelectorAll("script,style").forEach(x=>x.remove()); d.querySelectorAll("br,p,li,h1,h2,h3,h4,div,tr").forEach(x=>x.append("\n")); return (d.body.textContent||"").replace(/[ \t\u00a0]+/g," ").replace(/\n\s*\n+/g,"\n").trim(); }

/* ============ Notes: outlines made from slides ============ */
function makeOutline(m,open){
  const t=TEXT[m.id];
  const body=[`From [[${m.id}]]`,""];
  if(t&&t.slides&&t.slides.length){
    for(const s of t.slides){
      body.push(`## Slide ${s.n}${s.title?" · "+trimTo(s.title,90):""}`);

  else if(t&&t.text){ body.push(...t.text.split(/\n+/).slice(0,80).map(l=>"- "+trimTo(l,180))); }
  else body.push("");
  const n=newNote({courseId:m.courseId,sectionId:m.sectionId,title:m.name.replace(/\.[a-z0-9]{2,5}$/i,""),body:body.join("\n"),materialId:m.id,auto:true});

}

/* ============ Markdown (small, escaped first) ============ */
function inline(s){
  s=esc(s);
  s=s.replace(/\[\[([a-z0-9-]+)\]\]/gi,(x,id)=>{ const m=ST.materials[id]; return m?`<a class="matref" href="#/m/${esc(id)}">${IC[m.kind]?`<span class="kind ${m.kind}" style="width:18px;height:18px;background:none">${IC[m.kind]}</span>`:""}${esc(m.name)}</a>`:x; });
  s=s.replace(/`([^`]+)`/g,"<code>$1</code>")
     .replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
     .replace(/(^|[^*])\*([^*\s][^*]*)\*/g,"$1<em>$2</em>")
     .replace(/==([^=]+)==/g,"<mark>$1</mark>")
     .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  return s;
}
function md(src){
  const lines=String(src||"").split("\n"), out=[]; let list=null, para=[], quote=[];
  const endPara=()=>{ if(para.length){ out.push("<p>"+para.map(inline).join("<br>")+"</p>"); para=[]; } };
  const endList=()=>{ if(list){ out.push(`</${list}>`); list=null; } };
  const endQuote=()=>{ if(quote.length){ out.push("<blockquote>"+quote.map(inline).join("<br>")+"</blockquote>"); quote=[]; } };
  lines.forEach((l,i)=>{
    let m;
    if(!l.trim()){ endPara(); endList(); endQuote(); return; }
    if((m=/^(#{1,3})\s+(.*)/.exec(l))){ endPara(); endList(); endQuote(); const lv=m[1].length, sl=/^Slide (\d+)/.exec(m[2]); out.push(`<h${lv}${sl?` data-slide="${sl[1]}" title="Show this slide"`:""}>${inline(m[2])}</h${lv}>`); return; }
    if(/^\s*(-{3,}|\*{3,})\s*$/.test(l)){ endPara(); endList(); endQuote(); out.push("<hr>"); return; }
    if((m=/^>\s?(.*)/.exec(l))){ endPara(); endList(); quote.push(m[1]); return; }
    if((m=/^\s*[-*]\s+\[([ xX])\]\s*(.*)/.exec(l))){ endPara(); endQuote(); if(list!=="ul"){ endList(); out.push("<ul>"); list="ul"; } out.push(`<li class="task"><label><input type="checkbox" data-line="${i}"${m[1]!==" "?" checked":""}>${inline(m[2])}</label></li>`); return; }
    if((m=/^\s*[-*•]\s+(.*)/.exec(l))){ endPara(); endQuote(); if(list!=="ul"){ endList(); out.push("<ul>"); list="ul"; } out.push(`<li>${inline(m[1])}</li>`); return; }
    if((m=/^\s*\d+[.)]\s+(.*)/.exec(l))){ endPara(); endQuote(); if(list!=="ol"){ endList(); out.push("<ol>"); list="ol"; } out.push(`<li>${inline(m[1])}</li>`); return; }
    endList(); endQuote(); para.push(l);
  });
  endPara(); endList(); endQuote();
  return out.join("");
}

  <div class="note-layout${m?" split":""}">
    <div class="note-head" style="min-width:0">
      <input class="title-in" id="nTitle" value="${esc(n.title)}" placeholder="Untitled note" aria-label="Note title">
      <div class="note-meta">
        <select id="nCourse" aria-label="Class"><option value="">No class</option>${courses().map(x=>`<option value="${x.id}" ${x.id===n.courseId?"selected":""}>${esc(x.name)}</option>`).join("")}</select>
        ${c?`<select id="nSec" aria-label="Week or topic">${secOpts}</select>`:""}
        <span class="saved" id="nSaved">Saved</span><span style="flex:1"></span>
        <button class="btn small" data-act="toCards" title="Opens these terms in Recall Drill">Make flashcards</button>
        <button class="btn small" data-act="exportNote">Download</button>
        <button class="link danger" data-act="delNote">Delete</button>
      </div>
      <div class="ed">
        <div class="toolbar" role="toolbar" aria-label="Formatting">
          <span class="seg" role="group" aria-label="Mode"><button data-act="mode" data-m="edit" aria-pressed="${mode==="edit"}">Write</button><button data-act="mode" data-m="read" aria-pressed="${mode==="read"}">Read</button></span>
          <span class="sep"></span>
          <button class="tb" data-fmt="h" title="Heading">H</button><button class="tb" data-fmt="b" title="Bold (Ctrl+B)">B</button><button class="tb" data-fmt="i" title="Italic (Ctrl+I)"><i>I</i></button><button class="tb" data-fmt="hl" title="Highlight">==</button>
          <button class="tb" data-fmt="ul" title="Bullet list">•</button><button class="tb" data-fmt="task" title="To-do">☐</button><button class="tb" data-fmt="q" title="Quote">❝</button><button class="tb" data-fmt="term" title="Key term (becomes a flashcard)">T–D</button>
        </div>
        <textarea class="editor" id="nBody" spellcheck="true" placeholder="Start typing. Use “- ” for bullets, “## ” for headings, and “Term - definition” lines to make flashcards later." ${mode==="read"?"hidden":""}>${esc(n.body)}</textarea>

      </div>

  title.oninput=()=>{ n.title=title.value; touch(); };

function setMode(mode){
  const r=$("nRead"), b=$("nBody"); if(!r) return;
  document.querySelectorAll('[data-act="mode"]').forEach(x=>x.setAttribute("aria-pressed",x.dataset.m===mode));
  r.hidden=mode!=="read"; b.hidden=mode==="read";
  if(mode==="read") VIEW.showRead(); else b.focus();
  history.replaceState(null,"",`#/n/${VIEW.id}${mode==="read"?"?view=read":""}`); VIEW.q=new URLSearchParams(mode==="read"?"view=read":"");
}
function editorKeys(e,ta){
  if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&!e.altKey){ if(e.key==="b"){ e.preventDefault(); fmt("b"); } else if(e.key==="i"){ e.preventDefault(); fmt("i"); } return; }
  if(e.key==="Enter"&&!e.shiftKey){
    const s=ta.selectionStart, v=ta.value, ls=v.lastIndexOf("\n",s-1)+1, line=v.slice(ls,s), m=/^(\s*)([-*]\s\[[ xX]\]\s|[-*•]\s|(\d+)[.)]\s|>\s?)/.exec(line);
    if(!m||s!==ta.selectionEnd) return;
    e.preventDefault();
    if(line.trim()===m[0].trim()){ ta.setRangeText("",ls,s,"end"); }
    else { let mk=m[2]; if(m[3]) mk=(+m[3]+1)+mk.slice(m[3].length); if(/\[[xX]\]/.test(mk)) mk=mk.replace(/\[[xX]\]/,"[ ]"); ta.setRangeText("\n"+m[1]+mk,s,s,"end"); }
    ta.dispatchEvent(new Event("input"));
  }
  if(e.key==="Tab"&&/^\s*([-*•]|\d+[.)])\s/.test(ta.value.slice(ta.value.lastIndexOf("\n",ta.selectionStart-1)+1))){
    e.preventDefault(); const ls=ta.value.lastIndexOf("\n",ta.selectionStart-1)+1, pos=ta.selectionStart;
    if(e.shiftKey){ if(ta.value.slice(ls,ls+2)==="  "){ ta.setRangeText("",ls,ls+2,"preserve"); ta.selectionStart=ta.selectionEnd=Math.max(ls,pos-2); } }
    else { ta.setRangeText("  ",ls,ls,"preserve"); ta.selectionStart=ta.selectionEnd=pos+2; }
    ta.dispatchEvent(new Event("input"));
  }
}
function fmt(k){
  const ta=$("nBody"); if(!ta||ta.hidden) return;
  const s=ta.selectionStart, e=ta.selectionEnd, v=ta.value, sel=v.slice(s,e);
  const wrap=(a,b,ph)=>{ const t=sel||ph; ta.setRangeText(a+t+b,s,e,"select"); ta.selectionStart=s+a.length; ta.selectionEnd=s+a.length+t.length; };
  const prefix=p=>{ const ls=v.lastIndexOf("\n",s-1)+1, le=v.indexOf("\n",e), end=le<0?v.length:le, block=v.slice(ls,end).split("\n").map(l=>l.startsWith(p)?l.slice(p.length):p+l).join("\n"); ta.setRangeText(block,ls,end,"end"); };
  if(k==="b") wrap("**","**","bold"); else if(k==="i") wrap("*","*","italic"); else if(k==="hl") wrap("==","==","important");
  else if(k==="h") prefix("## "); else if(k==="ul") prefix("- "); else if(k==="task") prefix("- [ ] "); else if(k==="q") prefix("> ");
  else if(k==="term"){ const ls=v.lastIndexOf("\n",s-1)+1; ta.setRangeText((s>ls&&v.slice(ls,s).trim()?"\n":"")+"- "+(sel||"Term")+" - definition",s,e,"end"); }
  ta.focus(); ta.dispatchEvent(new Event("input"));
}

async function renderViewer(el,m,opts){
  const t=TEXT[m.id], ext=extOf(m.file||""), canFetch=m.type==="file"&&m.fileurl&&ST.moodle;
  const top=`<div class="viewer-top"><span class="chips"><span class="kind ${m.kind}" style="width:28px;height:28px">${IC[m.kind]}</span>${opts.compact?`<a href="#/m/${m.id}"><b>${esc(trimTo(m.name,60))}</b></a>`:`<span class="tag">${esc(KINDS[m.kind])}</span>`}</span>
    <span class="btnrow">${m.status==="saved"&&m.type==="file"&&!m.noFile?`<button class="btn small" data-act="openFile" data-id="${m.id}">Open file</button>`:""}${m.moodleUrl?`<a class="btn small" href="${esc(m.moodleUrl)}" target="_blank" rel="noopener">Moodle</a>`:""}</span></div>`;
  if(m.type==="link"){ el.innerHTML=top+`<p>This is a link to <a href="${esc(m.href)}" target="_blank" rel="noopener">${esc(m.href)}</a></p>`; return; }
  if(m.status!=="saved"&&m.status!=="stale"&&!t){
    el.innerHTML=top+`<div class="empty"><p>${m.dlFailed?esc(m.dlFailed):"This file is still on Moodle."}</p>
      <div class="btnrow">${canFetch?`<button class="btn primary small" data-act="dl" data-id="${m.id}">Download now</button>`:""}<button class="btn small" data-act="attach" data-id="${m.id}">Choose the file from your device</button></div>
      <p class="hint">If the download doesn't work, open it on Moodle, save it, then choose it here. It stays filed in the same place.</p><input type="file" id="attachIn" class="vh" tabindex="-1" aria-hidden="true"></div>`;
    return;
  }
  el.innerHTML=top+`<div id="vBody"><p class="hint">Opening…</p></div>`+(m.status==="stale"&&canFetch?`<p class="hint">There's a newer version on Moodle. <button class="link" data-act="dl" data-id="${m.id}">Get it</button></p>`:"");
  const vb=el.querySelector("#vBody");
  if(m.type==="page"||(t&&t.html)){ vb.innerHTML=`<div class="html-body">${t?.html||""}</div>`; return; }
  let blob=null; try{ blob=m.noFile?null:await DB.get("files",m.id); }catch(e){}
  if(!vb.isConnected) return;
  if(blob&&(ext==="pdf"||/pdf/.test(blob.type))){ await pdfView(vb,blob); return; }
  if(blob&&/^image\//.test(blob.type||m.mime)){ const u=URL.createObjectURL(blob); vb.innerHTML=`<img src="${u}" alt="${esc(m.name)}" style="max-width:100%;border-radius:10px">`; viewerCleanup=()=>URL.revokeObjectURL(u); return; }
  if(t&&t.slides){ vb.innerHTML=`<div class="pages">${t.slides.map(s=>`<div class="slide" id="pg-${s.n}"><span class="sn">Slide ${s.n}</span>${s.title?`<b>${esc(s.title)}</b>`:""}${s.lines.length?`<ul>${s.lines.map(l=>`<li>${esc(l)}</li>`).join("")}</ul>`:""}${s.notes?`<div class="spk">${esc(s.notes)}</div>`:""}</div>`).join("")}</div>`; return; }
  if(t&&t.md){ vb.innerHTML=`<div class="md solo">${md(t.md)}</div>`; return; }
  if(t&&t.text){ vb.innerHTML=`<div class="md solo" style="white-space:pre-wrap">${esc(t.text)}</div>`; return; }
  vb.innerHTML=`<div class="empty"><p>${m.readErr?esc(m.readErr):`This ${ext?ext.toUpperCase()+" ":""}file can't be shown here${["ppt","doc","key"].includes(ext)?" (older Office formats can't be read in the browser; save it as .pptx/.docx or PDF)":""}.`}</p>${blob?`<button class="btn small" data-act="openFile" data-id="${m.id}">Open file</button>`:""}</div>`;
}
async function pdfView(vb,blob){
  let pdf; try{ const lib=await pdfjs(); pdf=await lib.getDocument({data:new Uint8Array(await blob.arrayBuffer()),isEvalSupported:false}).promise; }
  catch(e){ vb.innerHTML=`<p class="err">${esc(e.message||"Couldn't open this PDF.")}</p>`; return; }
  if(!vb.isConnected) return;
  const first=await pdf.getPage(1), vp=first.getViewport({scale:1});
  vb.innerHTML=`<div class="pages">${Array.from({length:pdf.numPages},(_,i)=>`<div class="page" id="pg-${i+1}" data-p="${i+1}" style="aspect-ratio:${vp.width}/${vp.height}"><span class="pn">${i+1}</span></div>`).join("")}</div>`;
  const io=new IntersectionObserver(es=>es.forEach(async en=>{
    if(!en.isIntersecting||en.target.dataset.done) return; en.target.dataset.done=1; io.unobserve(en.target);
    const page=await pdf.getPage(+en.target.dataset.p), w=en.target.clientWidth||600, scale=w/page.getViewport({scale:1}).width*Math.min(2,devicePixelRatio||1);
    const v=page.getViewport({scale}), cv=document.createElement("canvas"); cv.width=v.width; cv.height=v.height;
    en.target.prepend(cv); await page.render({canvasContext:cv.getContext("2d"),viewport:v}).promise;
  }),{rootMargin:"600px 0px"});
  vb.querySelectorAll(".page").forEach(p=>io.observe(p));
  viewerCleanup=()=>{ io.disconnect(); pdf.destroy(); };
}
async function openFile(m){
  const blob=await DB.get("files",m.id); if(!blob){ toast("That file isn't saved on this device."); return; }
  const u=URL.createObjectURL(blob.type?blob:new Blob([blob],{type:m.mime||"application/octet-stream"}));
  const a=document.createElement("a"); a.href=u; a.target="_blank"; a.rel="noopener"; if(!/pdf|image|text/.test(blob.type||m.mime)) a.download=m.file||m.name; a.click(); setTimeout(()=>URL.revokeObjectURL(u),60000);
}

async function pickView(){
  if(!ST.moodle){ location.hash="#/connect"; return; }
  main.innerHTML=`<section class="card"><h2>Which classes should come in?</h2><p class="hint">Loading your Moodle classes…</p></section>`;
  let list;
  try{ list=await listMoodleCourses(); }
  catch(e){ main.innerHTML=`<section class="card"><h2>Couldn't load your classes</h2><p class="err">${esc(e.message)}</p><div class="btnrow"><button class="btn" data-act="repick">Try again</button><a class="btn" href="#/connect">Back</a></div></section>`; return; }
  if(VIEW.name!=="pick") return;
  const have=Object.fromEntries(Object.values(ST.courses).filter(c=>c.moodleId).map(c=>[c.moodleId,c]));
  list.sort((a,b)=>(b.current-a.current)||a.name.localeCompare(b.name));
  main.innerHTML=`<section class="card"><h2>Which classes should come in?</h2>
    <p class="hint">Classes running now are ticked. Each class brings its slides, files, Moodle pages and assignments.</p>
    ${list.length?`<div class="list">${list.map(c=>{ const on=have[c.id]?!have[c.id].archived:(c.current&&!c.ended); return `<label class="check"><input type="checkbox" value="${c.id}" ${on?"checked":""}><span><b>${esc(c.name)}</b><small>${esc(c.short)}${c.current?" · in progress":c.ended?" · ended":""}</small></span></label>`; }).join("")}</div>`:`<p class="empty">Moodle says you're not enrolled in any classes.</p>`}
    <div class="btnrow"><button class="btn primary" id="pGo">Import and sync</button><a class="btn" href="#/">Cancel</a></div></section>`;
  $("pGo").onclick=()=>{
    const ids=[...main.querySelectorAll("input[type=checkbox]:checked")].map(x=>+x.value), only=[];
    let i=Object.keys(ST.courses).length;
    for(const mc of list){
      const ex=have[mc.id];
      if(ids.includes(mc.id)){
        const c=ex||(ST.courses["c"+mc.id]={id:"c"+mc.id,moodleId:mc.id,color:COLORS[i++%COLORS.length],sections:[],order:i});
        Object.assign(c,{name:ex?.renamed?c.name:mc.name,short:mc.short,archived:false,moodleUrl:`${ST.moodle.site}/course/view.php?id=${mc.id}`}); only.push(c.id);
      } else if(ex) ex.archived=true;
    }
    save(); location.hash="#/"; syncAll(only);
  };
}

function searchView(){
  const q=(VIEW.q.get("q")||"").trim(), ql=q.toLowerCase();
  if($("q").value!==q&&document.activeElement!==$("q")) $("q").value=q;
  if(!q){ main.innerHTML=`<p class="empty">Type to search your notes, slides and assignments. Press ⌘K or / from anywhere.</p>`; setTimeout(()=>$("q").focus(),0); return; }
  const terms=ql.split(/\s+/).filter(Boolean), hit=s=>{ s=(s||"").toLowerCase(); return terms.every(t=>s.includes(t)); };
  const re=new RegExp("("+terms.map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")","gi");
  const hl=s=>esc(s).replace(re,"<mark>$1</mark>");
  const snip=(text)=>{ const s=String(text||""), i=s.toLowerCase().indexOf(terms[0]); if(i<0) return ""; const a=Math.max(0,i-60); return (a?"…":"")+s.slice(a,i+120).replace(/\s+/g," ")+"…"; };
  const notes=Object.values(ST.notes).filter(n=>hit(n.title+" "+n.body)).sort((a,b)=>b.updatedAt-a.updatedAt);
  const mats=[]; for(const m of Object.values(ST.materials)){ const t=TEXT[m.id]; if(hit(m.name)){ mats.push({m,s:""}); continue; }
    if(t&&t.slides){ const s=t.slides.find(s=>hit([s.title,...s.lines,s.notes].join(" "))); if(s){ mats.push({m,s:`${extOf(m.file)==="pdf"?"Page":"Slide"} ${s.n}: `+snip([s.title,...s.lines,s.notes].join(" ")),n:s.n}); continue; } }
    if(t&&hit(t.text)) mats.push({m,s:snip(t.text)}); }
  const asg=Object.values(ST.assignments).filter(a=>hit(a.name+" "+htmlText(a.intro||"")));
  main.innerHTML=`<h2>Results for “${esc(q)}”</h2>
    ${!notes.length&&!mats.length&&!asg.length?`<p class="empty">Nothing found.</p>`:""}
    ${notes.length?`<section class="group"><h3>Notes<span class="muted" style="font-family:var(--mono);font-size:.8rem"> ${notes.length}</span></h3><div class="list">${notes.map(n=>`<div class="row"><span class="kind notes">${IC.note}</span><a class="row-open" href="#/n/${n.id}"><b>${hl(n.title||"Untitled note")}</b><small><span class="cdot" style="--c:${courseColor(n.courseId)}"></span>${esc(courseName(n.courseId))}</small><span class="snip">${hl(snip(plain(n.body))||trimTo(plain(n.body),120))}</span></a><div class="acts"></div></div>`).join("")}</div></section>`:""}
    ${mats.length?`<section class="group"><h3>Slides & files<span class="muted" style="font-family:var(--mono);font-size:.8rem"> ${mats.length}</span></h3><div class="list">${mats.map(({m,s,n})=>`<div class="row"><span class="kind ${m.kind}">${IC[m.kind]}</span><a class="row-open" href="#/m/${m.id}${n?"?p="+n:""}"><b>${hl(m.name)}</b><small><span class="cdot" style="--c:${courseColor(m.courseId)}"></span>${esc(courseName(m.courseId))}</small>${s?`<span class="snip">${hl(s)}</span>`:""}</a><div class="acts"></div></div>`).join("")}</div></section>`:""}
    ${asg.length?`<section class="group"><h3>Assignments</h3><div class="list">${asg.map(a=>assignRow(a,true)).join("")}</div></section>`:""}`;
}

/* ---------- Files dropped in by hand ---------- */
function wireDrop(c){
  const d=$("drop"), inp=$("fileIn"); if(!d) return;
  inp.onchange=()=>{ addFiles(c,[...inp.files]); inp.value=""; };
  d.ondragover=e=>{ e.preventDefault(); d.classList.add("over"); };
  d.ondragleave=()=>d.classList.remove("over");
  d.ondrop=e=>{ e.preventDefault(); d.classList.remove("over"); addFiles(c,[...e.dataTransfer.files]); };
}
async function addFiles(c,files){
  if(!files.length) return;
  let matched=0;
  for(const f of files){
    // Same file name as something still on Moodle? Fill that in instead of adding a copy
    let m=Object.values(ST.materials).find(x=>x.courseId===c.id&&x.type==="file"&&x.status!=="saved"&&x.file&&x.file.toLowerCase()===f.name.toLowerCase());
    if(m) matched++;
    else { const week=guessSection(c,f.name); m={id:"u"+uid(),courseId:c.id,source:"upload",type:"file",name:f.name.replace(/\.[a-z0-9]{2,5}$/i,""),file:f.name,size:f.size,mime:f.type,addedAt:Date.now(),sectionId:week,kind:classify(f.name,f.name,"file"),status:"remote"}; ST.materials[m.id]=m; }
    toast("Reading "+f.name+"…");
    try{ await storeFile(m,f); }catch(e){ toast("Couldn't save "+f.name+": "+(e.message||e)); }
  }
  save(); render(); toast(`Added ${files.length} file${files.length===1?"":"s"}`+(matched?` (${matched} matched to Moodle)`:""));
}
function guessSection(c,name){
  const n=/(?:week|wk|unit|module|topic|lec(?:ture)?|chapter|ch)[\s_-]*0*(\d{1,2})/i.exec(name); if(!n) return null;
  const s=(c.sections||[]).find(s=>new RegExp(`\\b0*${n[1]}\\b`).test(s.name)||s.num===+n[1]);
  return s?s.id:null;
}

/* ---------- Flashcards ---------- */
function toFlashcards(n){
  const lines=n.body.split("\n").filter(l=>!/^\s*#/.test(l)&&!/^From \[\[/.test(l)).map(l=>l.replace(/^\s*>\s?/,"").replace(/\*\*|==|`/g,"").replace(/^\s*[-*•]\s+(\[[ xX]\]\s*)?/,"").trim())
    .filter(l=>/\S\s+[-–—=:]\s+\S|\S:\s+\S|\t/.test(l)&&l.length<400);
  if(lines.length<2){ toast("Write at least two “Term - definition” lines first."); return; }
  try{ localStorage.setItem("recall-drill-handoff",JSON.stringify({name:n.title||"Notes",text:lines.join("\n"),at:Date.now()})); }catch(e){ toast("Couldn't hand the terms over."); return; }
  flush().then(()=>location.href="../");
}

/* ---------- Clicks ---------- */
document.addEventListener("click",async e=>{
  const go=e.target.closest("[data-go]"); if(go){ location.hash=go.dataset.go; return; }
  const sl=e.target.closest(".md h2[data-slide]"); if(sl){ const p=$("pg-"+sl.dataset.slide); if(p){ p.scrollIntoView({behavior:"smooth",block:"start"}); p.classList.remove("flash-hi"); void p.offsetWidth; p.classList.add("flash-hi"); } return; }
  const fb=e.target.closest("[data-fmt]"); if(fb){ fmt(fb.dataset.fmt); return; }
  const t=e.target.closest("[data-act]"); if(!t) { document.querySelectorAll(".menu-pop").forEach(p=>{ if(!p.contains(e.target)) p.hidden=true; }); return; }
  const a=t.dataset.act, id=t.dataset.id;
  if(a!=="courseMenu"&&a!=="matMenu"&&!t.closest(".menu-pop")) document.querySelectorAll(".menu-pop").forEach(p=>p.hidden=true);
  if(a==="sync") syncAll();
  else if(a==="syncOne") syncAll([id]);
  else if(a==="dismissSync"){ SYNC.err=null; SYNC.msg=null; syncLine(); }
  else if(a==="demo") demo();
  else if(a==="repick") pickView();
  else if(a==="newNote"){ const cid=t.dataset.course||null, n=newNote({courseId:cid}); location.hash="#/n/"+n.id; }
  else if(a==="takeNotes"){ const m=ST.materials[id], ns=notesFor(id); if(ns.length&&!t.dataset.new){ location.hash="#/n/"+ns[0].id; return; } makeOutline(m,true); }
  else if(a==="mode") setMode(t.dataset.m);
  else if(a==="delNote"){ const n=ST.notes[VIEW.id]; if(!confirm(`Delete “${n.title||"Untitled note"}”? This can't be undone.`)) return; delete ST.notes[n.id]; save(); location.hash=n.courseId?"#/c/"+n.courseId+"/notes":"#/"; }
  else if(a==="toCards") toFlashcards(ST.notes[VIEW.id]);
  else if(a==="exportNote"){ const n=ST.notes[VIEW.id], txt="# "+(n.title||"Untitled note")+"\n\n"+n.body.replace(/\[\[([a-z0-9-]+)\]\]/gi,(x,i)=>ST.materials[i]?.name||x), u=URL.createObjectURL(new Blob([txt],{type:"text/markdown"})), l=document.createElement("a"); l.href=u; l.download=(n.title||"note").replace(/[^\w\s-]+/g,"").trim().slice(0,60)+".md"; l.click(); setTimeout(()=>URL.revokeObjectURL(u),5000); }
  else if(a==="assignDone"){ const x=ST.assignments[id]; x.done=t.checked; save(); setTimeout(render,250); }
  else if(a==="assignNote"){ const x=ST.assignments[id]; const n=newNote({courseId:x.courseId,title:x.name,assignId:x.id,body:`Due ${fmtDue(x.due)}\n\n## What's asked\n${htmlText(x.intro||"").split("\n").filter(Boolean).map(l=>"- "+l).join("\n")||"- "}\n\n## Plan\n- [ ] \n`}); location.hash="#/n/"+n.id; }
  else if(a==="addAssign"){ const name=prompt("Assignment name"); if(!name) return; const d=prompt("Due date (YYYY-MM-DD), or leave empty",""); const due=d&&!isNaN(new Date(d+"T23:59"))?new Date(d+"T23:59").getTime():0; const aid="a"+uid(); ST.assignments[aid]={id:aid,courseId:t.dataset.course,name:name.trim(),due,intro:""}; save(); render(); }
  else if(a==="delAssign"){ if(!confirm("Delete this assignment?")) return; const x=ST.assignments[id]; delete ST.assignments[id]; save(); location.hash="#/c/"+x.courseId+"/assignments"; }
  else if(a==="courseMenu"||a==="matMenu"){ const p=$(a==="courseMenu"?"cMenu":"mMenu"); p.hidden=!p.hidden; t.setAttribute("aria-expanded",!p.hidden); }
  else if(a==="cColor"){ const c=ST.courses[VIEW.id]; c.color=t.dataset.c; save(); render(); }
  else if(a==="archive"){ const c=ST.courses[id]; if(!confirm(`Remove “${c.name}” from this device? Its notes stay (with no class), its downloaded files are deleted.`)) return;
    for(const m of Object.values(ST.materials)) if(m.courseId===id) await removeMaterial(m.id);
    for(const x of Object.values(ST.assignments)) if(x.courseId===id) delete ST.assignments[x.id];
    for(const n of Object.values(ST.notes)) if(n.courseId===id){ n.courseId=null; n.sectionId=null; }
    if(c.moodleId) Object.assign(c,{archived:true,sections:[]}); else delete ST.courses[id];
    save(); location.hash="#/"; }
  else if(a==="pickFiles") $("fileIn").click();
  else if(a==="openFile") openFile(ST.materials[id]);
  else if(a==="dl"){ const m=ST.materials[id]; t.disabled=true; t.textContent="Downloading…"; try{ await downloadOne(m); toast("Saved"); }catch(err){ m.dlFailed=err.message; toast(err.message); } save(); render(true); }
  else if(a==="attach"){ const inp=$("attachIn"); inp.onchange=async()=>{ const f=inp.files[0]; if(!f) return; const m=ST.materials[id]; m.file=m.file||f.name; try{ await storeFile(m,f); toast("Saved"); }catch(err){ toast(err.message); } render(true); }; inp.click(); }
  else if(a==="delMat"){ if(!confirm("Delete this file from this device?")) return; const m=ST.materials[id]; await removeMaterial(id); save(); location.hash="#/c/"+m.courseId; }
  else if(a==="disconnect"){ if(!confirm("Sign this device out of Moodle? Your notes and files stay.")) return; const m=ST.moodle; ST.moodle=null; save(); render(true); toast("Disconnected from "+(m.sitename||"Moodle")); }
